        uses: l3montree-dev/devguard-ci-components/.github/workflows/full.yml@main
        with:
            devguard-asset-name: "lakshay-bachelors-thesis/projects/bachelors-thesis-ai-generated-code-gemini/assets/authforge-express-thesis-geminigenerated"
